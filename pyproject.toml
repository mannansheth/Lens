[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-rag"
version = "0.6.0"
description = "Lens: local application intelligence and grounded retrieval"
requires-python = ">=3.13,<3.14"
dependencies = [
  "psycopg[binary]>=3.2,<4", "PyMySQL>=1.1,<2", "pgvector>=0.4,<0.5",
  "tree-sitter>=0.25,<0.26", "tree-sitter-c-sharp>=0.23,<0.24", "tree-sitter-dart>=0.1,<0.2",
  "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-html>=0.23,<0.24", "tree-sitter-css>=0.23,<0.24",
  "sqlglot>=27,<29", "fastembed>=0.7,<0.9", "python-dotenv>=1,<2", "numpy>=2.1,<3",
  "tabulate>=0.9,<1", "pathspec>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.15"]
gemini = ["google-genai>=2.30,<3"]

[project.scripts]
lens = "lens.commands.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lens = ["database/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src", "sdks/python/src"]
markers = ["integration: requires a local PostgreSQL/pgvector database", "model: requires downloaded local embedding weights"]

[tool.ruff]
line-length = 100
